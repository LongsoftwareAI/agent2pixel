name: localhost-mvp
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: bash scripts/install.sh
      - run: .venv/bin/python -m pytest tests/backend -q
      - run: npm --prefix apps/web run build
      - run: npm --prefix apps/web test
      - run: .venv/bin/python -m ruff check --select E9,F63,F7,F82 services tests/backend
      - run: npm --prefix apps/web run lint
      - run: node --test apps/web/src/office/model.check.ts
